name: ✨ 功能请求
description: 建议一个新功能或改进
title: "[FEAT] "
labels: ["enhancement", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请详细描述你的想法，帮助我们理解其价值。

  - type: textarea
    id: problem
    attributes:
      label: 🤔 你的需求是什么？
      description: 清晰描述你遇到的问题或场景。
      placeholder: 例如：当我设计表单时，总是需要手动调整字段顺序，非常麻烦。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 你期望的解决方案
      description: 描述你希望我们如何解决这个问题。
      placeholder: 例如：希望能拖拽调整字段顺序。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 你考虑过的替代方案
      description: 描述你考虑过的其他解决方案或变通方法。

  - type: dropdown
    id: route
    attributes:
      label: 🛣️ 受影响路由
      options:
        - / (Home)
        - /designer (Designer System)
        - /ai-code (AI Code System)
        - /settings (Settings)
        - 全系统
        - 全新路由

  - type: dropdown
    id: priority
    attributes:
      label: 🎯 优先级
      options:
        - 🟢 Low - 锦上添花
        - 🟡 Medium - 改善体验
        - 🟠 High - 重要功能
        - 🔴 Critical - 阻断使用
    validations:
      required: true

  - type: textarea
    id: mockup
    attributes:
      label: 🎨 设计草图 / 参考
      description: 如适用，请附上草图、设计稿或其他产品的参考截图。

  - type: textarea
    id: context
    attributes:
      label: ➕ 补充信息

  - type: checkboxes
    id: terms
    attributes:
      label: 📋 检查清单
      options:
        - label: 我已搜索过现有 Issues，确认这不是重复请求
          required: true
        - label: 我已阅读 [CONTRIBUTING.md](../CONTRIBUTING.md)
          required: true
