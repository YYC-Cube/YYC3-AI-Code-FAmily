name: 🐛 Bug 报告
description: 报告一个 Bug 以帮助我们改进
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你抽出时间报告 Bug！请尽可能详细地填写以下信息，以帮助我们快速定位和修复问题。

  - type: textarea
    id: description
    attributes:
      label: 📝 Bug 描述
      description: 清晰简洁地描述 Bug 是什么。
      placeholder: 例如：当我点击"生成代码"按钮时，应用崩溃了。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 🔁 复现步骤
      description: 详细描述如何复现这个 Bug。
      placeholder: |
        1. 进入 '...'
        2. 点击 '...'
        3. 看到 '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ 期望行为
      description: 描述你期望发生的行为。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ 实际行为
      description: 描述实际发生的行为。
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 📸 截图 / 视频
      description: 如适用，请添加截图或录屏帮助说明问题。

  - type: dropdown
    id: system
    attributes:
      label: 🖥️ 系统
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 🌐 浏览器
      placeholder: 例如：Chrome 120.0.6099.109
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 📦 YYC³ 版本
      placeholder: 例如：1.0.0（可在 /settings 页面查看）
    validations:
      required: true

  - type: dropdown
    id: route
    attributes:
      label: 🛣️ 受影响路由
      options:
        - / (Home)
        - /designer (Designer System)
        - /ai-code (AI Code System)
        - /settings (Settings)
        - 全部
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📊 控制台日志
      description: 请粘贴浏览器控制台的错误日志（F12 → Console）。
      render: shell

  - type: textarea
    id: context
    attributes:
      label: ➕ 补充信息
      description: 添加任何其他关于该问题的上下文。

  - type: checkboxes
    id: terms
    attributes:
      label: 📋 检查清单
      options:
        - label: 我已搜索过现有 Issues，确认这不是重复问题
          required: true
        - label: 我已尝试使用最新版本，问题仍然存在
          required: true
        - label: 我已阅读 [CONTRIBUTING.md](../CONTRIBUTING.md)
          required: true
